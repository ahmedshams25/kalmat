 const d=await r.json();if(d.error)throw new Error(d.error.message);const q=d.candidates[0].content.parts.find(x=>x.inlineData).inlineData;

function vToday(){const q=queue(),l=lg(),m=S.cards.filter(c=>status(c)==='mastered').length,n=S.cards.filter(c=>!c.last).length,t=S.cards.length,lr=t-m-n;

function vQuiz(){if(QZ.stage==='setup'){return `<h1>اختبار</h1><p class="sub">اختبر نفسك — الإجابات الخاطئة ترجع للمراجعة تلقائيًا.</p><div class="g card"><label>نوع الاختبار</label><div class="seg">${[['en-ar','إنجليزي ← عربي'],['ar-en','عربي ← إنجليزي'],['spell','إملاء']].map(([k,l])=>`<button data-a="qm" data-k="${k}" class="${QZ.mode===k?'on':''}">${l}</button>`).join('')}</div><label>عدد الأسئلة</label><div class="seg">${[5,10,20].map(n=>`<button data-a="qn" data-k="${n}" class="${QZ.n===n?'on':''}">${n}</button>`).join('')}</div><button class="pri big" style="margin-top:16px" data-a="qstart">ابدأ الاختبار</button></div>`}
 if(QZ.stage==='done'){const p=Math.round(QZ.score/QZ.items.length*100);return `<h1>${p>=80?'ممتاز! 🏆':p>=50?'جيد 👍':'استمر 🚀'}</h1><div class="g card" style="text-align:center"><div style="font-size:54px;font-weight:800">${QZ.score}/${QZ.items.length}</div><p class="sub">${QZ.wrong.length?'الكلمات الخاطئة: '+QZ.wrong.map(esc).join('، '):'كل الإجابات صحيحة!'}</p><button class="pri big" data-a="qreset">اختبار جديد</button></div>`}
 const c=QZ.items[QZ.i],m=QZ.mode;let body='';
 if(m==='spell')body=`<div class="ar" style="text-align:center;margin:10px 0">${esc(c.ar)}</div><div class="row" style="justify-content:center;margin-bottom:12px"><button data-a="spk" data-w="${esc(c.en)}" style="flex:none">${ic('spk')} استمع</button></div><input id="sp" dir="ltr" autocapitalize="none" autocomplete="off" placeholder="اكتب الكلمة بالإنجليزية"><button class="pri big" style="margin-top:12px" data-a="spcheck">تحقق</button>`;
 else{const f=m==='en-ar'?'ar':'en',pool=shuf(S.cards.filter(x=>x.id!==c.id&&x[f]!==c[f]).map(x=>x[f])).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3),opts=shuf([c[f],...pool]);
  body=opts.map(o=>`<button class="opt g" data-a="opt" data-v="${esc(o)}" style="${f==='en'?'direction:ltr':''}">${esc(o)}</button>`).join('')}
 return `<h1>سؤال ${QZ.i+1}/${QZ.items.length}</h1><div class="bar" style="margin:8px 0 16px"><i class="new" style="width:${QZ.i/QZ.items.length*100}%"></i></div><div class="g card" style="text-align:center"><div class="en" style="${m==='ar-en'?'direction:rtl':''}">${m==='en-ar'?esc(c.en):m==='ar-en'?esc(c.ar):'✍️'}</div></div>${body}`}

function vSet(){const s=S.set;return `<h1>الإعدادات</h1><div class="g card"><label>المظهر</label><div class="seg">${[['auto','تلقائي'],['light','فاتح'],['dark','داكن']].map(([k,l])=>`<button data-a="th" data-k="${k}" class="${s.theme===k?'on':''}">${l}</button>`).join('')}</div><label>كلمات جديدة يوميًا</label><input id="nl" type="number" min="1" max="50" value="${s.newLimit}"><label>نطق الكلمة تلقائيًا في المراجعة</label><div class="seg"><button data-a="auto" data-k="1" class="${s.auto?'on':''}">مفعّل</button><button data-a="auto" data-k="0" class="${!s.auto?'on':''}">متوقف</button></div></div>
 ${aiCard()}${voiceCard()}
 <div class="g card"><b>نسخة احتياطية</b><p class="tip" style="margin:6px 0 12px">بياناتك محفوظة على هذا المتصفح. صدّر نسخة بشكل دوري، ويمكنك أيضًا استيراد ملف JSON من تطبيقك القديم.</p><div class="row"><button data-a="exp">تصدير JSON</button><button data-a="imp">استيراد ملف</button></div><input type="file" id="file" accept=".json" hidden></div>
 ${dupCard()}${syncCard()}<div class="g card"><button class="bad" style="width:100%" data-a="reset">مسح كل البيانات</button></div>`}

 <div class="fc g" ${SS.shown?'':'data-a="show"'}><div class="pos">${esc(c.pos)} · ${SL[status(c)]}</div><div class="en">${esc(c.en)}</div><div><button class="ib" data-a="spk" data-w="${esc(c.en)}" style="width:54px;min-height:54px;border-radius:27px">${ic('spk')}</button></div>
 ${SS.shown?`<div class="ar">${esc(c.ar)}</div>${c.ex?`<div class="ex">${esc(c.ex)}</div>`:''}`:'<p class="sub">حاول تتذكر المعنى، ثم اضغط لإظهار الإجابة</p>'}</div>
 ${SS.shown?`<div class="gr">${[['نسيتها','var(--bad)',0],['صعبة','var(--warn)',1],['جيدة','var(--tint)',2],['سهلة','var(--ok)',3]].map(([l,col,g])=>`<button data-a="gr" data-g="${g}" style="background:${col}">${l}<small>${lab(c,g)}</small></button>`).join('')}</div>`:`<div class="gr" style="grid-template-columns:1fr"><button class="pri" data-a="show">إظهار الإجابة</button></div>`}`}
function gradeIt(g){const id=SS.q[SS.i],k=S.cards.findIndex(c=>c.id===id),c=S.cards[k],l=lg();if(!c.last)l.new++;l.rev++;l.words=l.words||[];if(!l.words.includes(id))l.words.push(id);S.cards[k]=apply(c,g);if(g===0)SS.q.push(id);SS.i++;SS.shown=false;save();rs();if(S.set.auto&&SS.i<SS.q.length)speak(S.cards.find(x=>x.id===SS.q[SS.i]).en)}

const hl=t=>t.split(/(\*\*[^*]+\*\*)/).map(p=>{const m=/^\*\*([^*]+)\*\*$/.exec(p);const x=m?m[1]:p.replace(/\*\*/g,'');const h=x.split(/([A-Za-z][A-Za-z'’-]*)/).map((w,i)=>i%2?`<span data-a="spk" data-w="${esc(w)}">${esc(w)}</span>`:esc(w)).join('');return m?`<mark>${h}</mark>`:h}).join('');

const mkPrompt=(cs,topic)=>`You are an English teacher for an Arabic-speaking learner (level B1-B2).
Write ONE short, realistic passage (110-150 words, 6-9 sentences) about ${topic?`this topic: "${topic}"`:'a real-world topic (pick one: news, work, travel, health, technology, money, daily life)'}.
Use ALL of these target words naturally, each at least once (inflections allowed):

Return ONLY valid JSON, no markdown fences: {"title":"short English title","topic":"الموضوع بالعربي في كلمتين","text":"the passage","ar":"full Arabic translation"}`;
const mkExtract=(txt,n,have)=>`You are an English teacher for an Arabic-speaking learner (level B1-B2).

${txt}`;

function rstory(){const sh=$('#sheet'),l=lg(),s=l.story;
 const head=`<div class="wrap"><div class="row" style="gap:14px;margin-bottom:6px"><button class="ib" data-a="close" style="flex:none">${ic('x')}</button><b style="flex:1;font-size:18px">المرحلة ٢ — القراءة في سياق</b></div>`;

 if(s&&!ST.gen){sh.innerHTML=head+`<div class="g card" style="margin-top:16px"><div class="pos" style="text-align:right">${esc(s.topic)}</div><b style="font-size:22px;direction:ltr;display:block;text-align:left;margin:4px 0 8px">${esc(s.title)}</b><div class="pass">${hl(s.text)}</div>${ST.ar&&s.ar?`<div class="passar">${esc(s.ar)}</div>`:''}</div>
 <div class="row" style="margin-bottom:10px"><button data-a="spkall" data-r=".9">${ic('spk')} استمع</button><button data-a="spkall" data-r=".65">🐢 ببطء</button><button data-a="tr">${ST.ar?'إخفاء الترجمة':'الترجمة'}</button></div>
 <p class="tip" style="margin-bottom:12px">اضغط على أي كلمة لسماع نطقها. الكلمات المظلّلة هي كلمات اليوم.</p>
 <button class="pri big" data-a="speak">المرحلة ٣ ← اختبار النطق 🎤</button>
