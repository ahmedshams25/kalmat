<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كلماتي — تعلّم الإنجليزية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1fb;--b1:#8ab4ff;--b2:#ffb0d4;--b3:#a8f0d8;--ink:#1d1d1f;--sub:#6e6e73;--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.38);--stroke:rgba(255,255,255,.75);--tint:#0a84ff;--ok:#30b45a;--warn:#ff9f0a;--bad:#ff453a;--sh:0 10px 40px rgba(40,60,140,.14)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a12;--b1:#2b4a9e;--b2:#7a2f66;--b3:#1f6b58;--ink:#f5f5f7;--sub:#a1a1a6;--glass:rgba(44,44,56,.52);--glass2:rgba(60,60,76,.36);--stroke:rgba(255,255,255,.14);--tint:#0a84ff;--ok:#32d74b;--sh:0 10px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0a0a12;--b1:#2b4a9e;--b2:#7a2f66;--b3:#1f6b58;--ink:#f5f5f7;--sub:#a1a1a6;--glass:rgba(44,44,56,.52);--glass2:rgba(60,60,76,.36);--stroke:rgba(255,255,255,.14);--tint:#0a84ff;--ok:#32d74b;--sh:0 10px 40px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","Tajawal",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40% 35% at 15% 10%,var(--b1),transparent 70%),radial-gradient(40% 35% at 90% 30%,var(--b2),transparent 70%),radial-gradient(45% 40% at 40% 95%,var(--b3),transparent 70%);opacity:.75}
main{max-width:640px;margin:0 auto;padding:18px 16px 130px}
h1{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:10px 4px 4px}
.sub{color:var(--sub);font-size:15px;margin:0 4px 18px}
.g{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--sh)}
.card{padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{padding:16px}.stat b{display:block;font-size:30px;font-weight:800}.stat span{font-size:13px;color:var(--sub)}
button{font:inherit;color:inherit;border:0;cursor:pointer;min-height:44px;border-radius:14px;padding:0 18px;background:var(--glass2);border:1px solid var(--stroke);transition:transform .15s,background .2s}
button:active{transform:scale(.96)}
.pri{background:var(--tint);color:#fff;border-color:transparent;font-weight:700;font-size:17px}
.pri.big{width:100%;min-height:54px;border-radius:18px}
.ok{background:var(--ok);color:#fff;border-color:transparent}.bad{background:var(--bad);color:#fff;border-color:transparent}
input,select,textarea{font:inherit;color:var(--ink);width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass2);outline:none;backdrop-filter:blur(10px)}
input:focus,textarea:focus,select:focus{border-color:var(--tint);box-shadow:0 0 0 3px rgba(10,132,255,.25)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--sub);margin:12px 4px 6px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke);gap:2px;margin:6px 0}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:11px;font-size:14px;padding:0 6px}
.seg button.on{background:var(--glass);box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:700}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px}
.item .t{flex:1;min-width:0}.item b{font-size:18px;display:block;direction:ltr;text-align:right}.item small{color:var(--sub);display:block;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.new{background:var(--tint)}.learning{background:var(--warn)}.mastered{background:var(--ok)}
.ib{width:44px;padding:0;flex:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{height:8px;border-radius:8px;background:var(--glass2);overflow:hidden;display:flex}.bar i{display:block;height:100%}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 28px));display:flex;padding:6px;border-radius:30px;z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;min-height:54px;border:0;background:transparent;border-radius:24px;color:var(--sub);padding:0}
nav button.on{background:var(--glass2);color:var(--tint);font-weight:700}
#sheet{position:fixed;inset:0;z-index:50;display:none;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);overflow:auto}
#sheet::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(50% 40% at 80% 10%,var(--b1),transparent 70%),radial-gradient(50% 40% at 10% 90%,var(--b2),transparent 70%);opacity:.7}
#sheet.open{display:block;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.fc{max-width:560px;margin:18px auto;padding:34px 22px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.en{font-size:42px;font-weight:800;direction:ltr;letter-spacing:-.5px}.pos{font-size:13px;color:var(--sub);direction:ltr}
.ar{font-size:30px;font-weight:700;color:var(--tint)}.ex{font-size:16px;color:var(--sub);direction:ltr;font-style:italic}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
.gr button{display:flex;flex-direction:column;gap:2px;min-height:62px;font-weight:700;color:#fff;border:0}.gr small{font-weight:400;font-size:11px;opacity:.9}
.opt{display:block;width:100%;text-align:center;margin-bottom:10px;min-height:54px;font-size:18px}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);padding:12px 20px;border-radius:20px;z-index:99;transition:transform .35s;font-size:15px;display:flex;gap:12px;align-items:center}
#toast.on{transform:translate(-50%,0)}#toast button{min-height:30px;padding:0 10px;color:var(--tint);font-weight:700}
.tip{font-size:14px;line-height:1.7;color:var(--sub)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="v"></main>
<nav class="g" id="nav"></nav>
<div id="sheet"></div>
<div id="toast" class="g"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={today:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',lib:'<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 10h8M8 14h5"/>',add:'<path d="M12 5v14M5 12h14"/>',quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',spk:'<path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9a4 4 0 010 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',del:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const DEF={cards:[],log:{},set:{newLimit:10,auto:true,theme:'auto'}};
let S;try{S=JSON.parse(localStorage.getItem('vocab.v2'))}catch(e){}
S=S||JSON.parse(JSON.stringify(DEF));S.del=S.del||{};
const store=()=>{try{localStorage.setItem('vocab.v2',JSON.stringify(S))}catch(e){}};
let user=null,syncing=false,st='',stm=null;
const save=()=>{store();dsync()};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const lg=()=>S.log[today()]||(S.log[today()]={rev:0,new:0});
const status=c=>!c.last?'new':c.ivl>=21?'mastered':'learning';
const SL={new:'جديدة',learning:'قيد التعلّم',mastered:'متقنة'};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
let tt;function toast(m,undo){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>`+(undo?'<button data-a="undo">تراجع</button>':'');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),undo?5000:2200)}
function theme(){const t=S.set.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
const newCard=(en,ar,ex='',pos='',topic='')=>({id:Date.now()+Math.floor(Math.random()*1e6),en:en.trim(),ar:ar.trim(),ex:ex.trim(),pos,topic:topic.trim(),added:Date.now(),u:Date.now(),due:0,ivl:0,ease:2.5,reps:0,lapses:0,last:0});
/* ---------- SRS ---------- */
function apply(c,g,now=Date.now()){c=Object.assign({},c);
 if(g===0){c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.ivl=0;c.reps=0;c.due=now+10*6e4}
 else{c.reps++;if(g===1){c.ease=Math.max(1.3,c.ease-.15);c.ivl=Math.max(1,c.ivl*1.2)}else if(g===2){c.ivl=c.reps===1?1:c.reps===2?3:c.ivl*c.ease}else{c.ease+=.15;c.ivl=Math.max(4,c.reps<=1?4:c.ivl*c.ease*1.3)}
  c.ivl=Math.round(c.ivl);c.due=now+c.ivl*864e5}
 c.last=now;c.u=now;return c}
const lab=(c,g)=>{const n=apply(c,g);return g===0?'١٠ د':n.ivl+' يوم'};
function queue(){const n=Date.now(),l=lg();const rev=S.cards.filter(c=>c.last&&c.due<=n);const nw=S.cards.filter(c=>!c.last).slice(0,Math.max(0,S.set.newLimit-l.new));return shuf(rev).concat(nw)}
function streak(){let d=new Date(),s=0;const k=x=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);if(!(S.log[k(d)]||{}).rev)d.setDate(d.getDate()-1);while((S.log[k(d)]||{}).rev>0){s++;d.setDate(d.getDate()-1)}return s}
/* ---------- views ---------- */
let T='today',F='all',Q='',QZ={stage:'setup',mode:'en-ar',n:10};
const TABS=[['today','اليوم'],['lib','المكتبة'],['add','إضافة'],['quiz','اختبار'],['set','الإعدادات']];
const TIPS=['اكتب جملة من تأليفك لكل كلمة جديدة — الحفظ بالسياق أقوى بكثير من الحفظ المعزول.','٥ دقائق يوميًا أفضل من ساعة في الأسبوع. الانتظام هو السر.','انطق الكلمة بصوت عالٍ بعد سماعها؛ النطق يثبّت الكلمة في الذاكرة.','أضف الكلمة مع مثال واحد على الأقل وتعلّم الكلمات المركبة (collocations) مثل make a decision.','لا تضف أكثر من ١٠ كلمات جديدة يوميًا؛ الجودة قبل الكمية.'];
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-a="tab" data-k="${k}" class="${T===k?'on':''}">${ic(k)}<span>${l}</span></button>`).join('')}
function vToday(){const q=queue(),l=lg(),m=S.cards.filter(c=>status(c)==='mastered').length,n=S.cards.filter(c=>!c.last).length,t=S.cards.length,lr=t-m-n;
 const tot=l.rev+q.length,p=tot?Math.round(l.rev/tot*100):0,C=2*Math.PI*42;
 return `<h1>أهلاً 👋</h1><p class="sub">${q.length?`عندك ${q.length} بطاقة جاهزة للمراجعة`:'خلّصت مراجعة اليوم — برافو!'}</p>
 <div class="g card" style="display:flex;align-items:center;gap:18px"><svg width="104" height="104" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--glass2)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--tint)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${p}%</text></svg>
 <div style="flex:1"><b style="font-size:19px">هدف اليوم</b><p class="sub" style="margin:4px 0 12px">تمت مراجعة ${l.rev} بطاقة</p><button class="pri big" data-a="study" ${q.length?'':'disabled style="opacity:.5"'}>ابدأ المراجعة</button></div></div>
 <div class="grid"><div class="g stat"><b>${t}</b><span>إجمالي الكلمات</span></div><div class="g stat"><b>🔥 ${streak()}</b><span>أيام متتالية</span></div><div class="g stat"><b>${q.length}</b><span>مستحقة الآن</span></div><div class="g stat"><b>${m}</b><span>كلمات متقنة</span></div></div>
 <div class="g card"><b>مستوى الإتقان</b><div class="bar" style="margin:12px 0 8px">${t?`<i class="mastered" style="width:${m/t*100}%"></i><i class="learning" style="width:${lr/t*100}%"></i><i class="new" style="width:${n/t*100}%"></i>`:''}</div><div class="tip">🟢 متقنة ${m} · 🟠 قيد التعلّم ${lr} · 🔵 جديدة ${n}</div></div>
 <div class="g card tip">💡 <b style="color:var(--ink)">نصيحة المدرّس:</b> ${TIPS[new Date().getDate()%TIPS.length]}</div>
 ${t?'':'<div class="g card" style="text-align:center"><p class="sub">ابدأ بإضافة أول كلماتك</p><button class="pri" data-a="tab" data-k="add">إضافة كلمات</button></div>'}`}
function vLib(){let L=S.cards.filter(c=>(F==='all'||status(c)===F)&&(!Q||(c.en+c.ar+c.topic).toLowerCase().includes(Q.toLowerCase())));L=L.slice().sort((a,b)=>b.added-a.added);
 return `<h1>المكتبة</h1><p class="sub">${S.cards.length} كلمة</p><input id="q" placeholder="ابحث بالإنجليزي أو العربي…" value="${esc(Q)}"><div class="seg">${[['all','الكل'],['new','جديدة'],['learning','قيد التعلّم'],['mastered','متقنة']].map(([k,l])=>`<button data-a="flt" data-k="${k}" class="${F===k?'on':''}">${l}</button>`).join('')}</div>
 <div style="margin-top:12px">${L.length?L.slice(0,200).map(c=>`<div class="g item"><span class="dot ${status(c)}"></span><div class="t"><b>${esc(c.en)}</b><small>${esc(c.ar)}</small>${c.ex?`<small style="direction:ltr;text-align:right;font-style:italic">${esc(c.ex)}</small>`:''}</div><button class="ib" data-a="spk" data-w="${esc(c.en)}">${ic('spk')}</button><button class="ib" data-a="del" data-id="${c.id}">${ic('del')}</button></div>`).join(''):'<p class="sub" style="text-align:center;margin-top:40px">لا توجد نتائج</p>'}</div>`}
function vAdd(){return `<h1>إضافة كلمة</h1><p class="sub">أضف الكلمة مع مثال — هذا يضاعف فرص تذكّرها.</p>
 <div class="g card"><label>الكلمة الإنجليزية</label><input id="a-en" dir="ltr" autocapitalize="none" autocomplete="off"><label>المعنى بالعربي</label><input id="a-ar"><label>جملة مثال (اختياري لكن مهم)</label><input id="a-ex" dir="ltr"><div class="row"><div><label>نوع الكلمة</label><select id="a-pos"><option value="">—</option><option>noun</option><option>verb</option><option>adjective</option><option>adverb</option><option>phrase</option></select></div><div><label>الموضوع</label><input id="a-tp" placeholder="عمل، سفر…"></div></div><button class="pri big" style="margin-top:16px" data-a="add">حفظ الكلمة</button></div>
 <div class="g card"><b>إضافة عدة كلمات دفعة واحدة</b><p class="tip" style="margin:6px 0">سطر لكل كلمة بالشكل: <span dir="ltr">word - المعنى - example</span> (يمكن الفصل بـ - أو , أو |)</p><textarea id="bulk" dir="ltr" placeholder="resilient - مرن - She is resilient.&#10;achieve - يحقق"></textarea><button class="pri big" style="margin-top:12px" data-a="bulk">استيراد</button></div>`}
function vQuiz(){if(QZ.stage==='setup'){return `<h1>اختبار</h1><p class="sub">اختبر نفسك — الإجابات الخاطئة ترجع للمراجعة تلقائيًا.</p><div class="g card"><label>نوع الاختبار</label><div class="seg">${[['en-ar','إنجليزي ← عربي'],['ar-en','عربي ← إنجليزي'],['spell','إملاء']].map(([k,l])=>`<button data-a="qm" data-k="${k}" class="${QZ.mode===k?'on':''}">${l}</button>`).join('')}</div><label>عدد الأسئلة</label><div class="seg">${[5,10,20].map(n=>`<button data-a="qn" data-k="${n}" class="${QZ.n===n?'on':''}">${n}</button>`).join('')}</div><button class="pri big" style="margin-top:16px" data-a="qstart">ابدأ الاختبار</button></div>`}
 if(QZ.stage==='done'){const p=Math.round(QZ.score/QZ.items.length*100);return `<h1>${p>=80?'ممتاز! 🏆':p>=50?'جيد 👍':'استمر 🚀'}</h1><div class="g card" style="text-align:center"><div style="font-size:54px;font-weight:800">${QZ.score}/${QZ.items.length}</div><p class="sub">${QZ.wrong.length?'الكلمات الخاطئة: '+QZ.wrong.map(esc).join('، '):'كل الإجابات صحيحة!'}</p><button class="pri big" data-a="qreset">اختبار جديد</button></div>`}
 const c=QZ.items[QZ.i],m=QZ.mode;let body='';
 if(m==='spell')body=`<div class="ar" style="text-align:center;margin:10px 0">${esc(c.ar)}</div><div class="row" style="justify-content:center;margin-bottom:12px"><button data-a="spk" data-w="${esc(c.en)}" style="flex:none">${ic('spk')} استمع</button></div><input id="sp" dir="ltr" autocapitalize="none" autocomplete="off" placeholder="اكتب الكلمة بالإنجليزية"><button class="pri big" style="margin-top:12px" data-a="spcheck">تحقق</button>`;
 else{const f=m==='en-ar'?'ar':'en',pool=shuf(S.cards.filter(x=>x.id!==c.id&&x[f]!==c[f]).map(x=>x[f])).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3),opts=shuf([c[f],...pool]);
  body=opts.map(o=>`<button class="opt g" data-a="opt" data-v="${esc(o)}" style="${f==='en'?'direction:ltr':''}">${esc(o)}</button>`).join('')}
 return `<h1>سؤال ${QZ.i+1}/${QZ.items.length}</h1><div class="bar" style="margin:8px 0 16px"><i class="new" style="width:${QZ.i/QZ.items.length*100}%"></i></div><div class="g card" style="text-align:center"><div class="en" style="${m==='ar-en'?'direction:rtl':''}">${m==='en-ar'?esc(c.en):m==='ar-en'?esc(c.ar):'✍️'}</div></div>${body}`}
